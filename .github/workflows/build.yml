name: Build Python EXE

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "formulas/**" ]
  workflow_dispatch: # Allows you to run the build manually from the Actions tab
  
jobs:
  build:
    runs-on: windows-latest  # Essential for compiling a Windows .exe file

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Change to your preferred Python version
  
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install pyinstaller
        pip install kivy[base]
        pip install kivy_deps.sdl2 kivy_deps.glew
        
    - name: Compile Script to EXE
      run: |
        pyinstaller --onefile --noconsole --name="Cave_adventures" --hidden-import=kivy.core.window.window_sdl2 --hidden-import=kivy.core.text.text_sdl2 main.py
        # Replace 'main.py' with the name of your script.
        # --onefile packages everything into a single .exe
        # --noconsole hides the command prompt window if it's a GUI app

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cave-Adventures
        path: dist/Cave_adventures.exe  # PyInstaller outputs the final file inside the 'dist' folder
